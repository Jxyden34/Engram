<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Engram licence manager</title>
<style>body{background:#101411;color:#eef2ed;font:16px system-ui;margin:0}main{max-width:1050px;margin:5vh auto;padding:24px}h1{font-size:38px}p,small{color:#b9c5b9;line-height:1.6}article{padding:24px;margin:18px 0;border:1px solid #526052;border-radius:16px}button,input{padding:12px;border-radius:8px;font:inherit;margin:8px 8px 8px 0;min-height:44px}button{background:#c6f77c;border:0;cursor:pointer}input{background:#202820;color:inherit;border:1px solid #647364}code{overflow-wrap:anywhere}#notice{color:#c6f77c}label{display:block}</style>
<main><small>ENGRAM / OWNER</small><h1>Licence manager</h1><p>Confirm payment only after you have received it separately. Confirmation issues one key and queues its email. Failed deliveries retry automatically; resend always uses the same key.</p><button id="refresh">Refresh orders</button><p id="notice" role="status"></p><div id="orders"></div></main>
<script>let csrf='';const notice=document.querySelector('#notice');async function action(id,kind,expires){if((kind==='paid'||kind==='renew')&&!confirm('Confirm you received payment for this order? A licence key will be emailed.'))return;try{const response=await fetch('./orders/'+id+'/'+kind,{method:'POST',headers:{'Content-Type':'application/json','X-Owner-CSRF':csrf},body:(kind==='paid'||kind==='renew')?JSON.stringify({expires}):undefined});const data=await response.json();if(!response.ok)throw Error(typeof data.detail==='string'?data.detail:'Check the expiry date.');notice.textContent=data.message||'Email queued';await load()}catch(error){notice.textContent=error.message}}async function load(){try{const response=await fetch('./orders',{cache:'no-store'});if(!response.ok)throw Error('Owner authentication failed');const data=await response.json();csrf=data.csrf;const list=document.querySelector('#orders');list.replaceChildren();for(const order of data.orders){const card=document.createElement('article');const heading=document.createElement('h2');heading.textContent=order.customer;card.append(heading);for(const value of [order.email,'Installation: '+order.installation_id,'Order: '+order.id,order.paid?'Paid Â· expires '+order.expires+' Â· email '+order.mail_state:'Awaiting manual payment confirmation · '+order.kind,order.last_error?'Delivery error: '+order.last_error:'']){const p=document.createElement('p');p.textContent=value;card.append(p)}if(!order.paid){const label=document.createElement('label');label.textContent='Last licensed day (UTC)';const date=document.createElement('input');date.type='date';date.required=true;label.append(date);card.append(label);const button=document.createElement('button');button.textContent='Mark paid & email key';button.onclick=()=>date.value?action(order.id,'paid',date.value):date.reportValidity();card.append(button)}else{const button=document.createElement('button');button.textContent='Resend same key';button.onclick=()=>action(order.id,'resend');card.append(button)}if(order.paid){const label=document.createElement('label');label.textContent='Renew through (UTC)';const date=document.createElement('input');date.type='date';date.required=true;date.min=order.expires;label.append(date);card.append(label);const button=document.createElement('button');button.textContent='Confirm renewal payment & email replacement';button.onclick=()=>date.value?action(order.id,'renew',date.value):date.reportValidity();card.append(button)}list.append(card)}if(!data.orders.length)list.textContent='No licence requests yet.'}catch(error){notice.textContent=error.message}}document.querySelector('#refresh').onclick=load;load();</script></html>
