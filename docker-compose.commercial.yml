services:
  api:
    image: engram-api:3.7.0-dev-beta.7-commercial
    build:
      context: ./backend
      args:
        ENGRAM_EDITION: commercial
  worker:
    image: engram-worker:3.7.0-dev-beta.7-commercial
    build:
      context: ./backend
      args:
        ENGRAM_EDITION: commercial
  connector-scheduler:
    image: engram-scheduler:3.7.0-dev-beta.7-commercial
    build:
      context: ./backend
      args:
        ENGRAM_EDITION: commercial
  web:
    image: engram-web:3.7.0-dev-beta.7-commercial
