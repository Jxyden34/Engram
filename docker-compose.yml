services:
  db:
    image: pgvector/pgvector:0.8.6-pg18-trixie@sha256:78bf48b801e792f99e3ac62b5036fd3876e9be48afda16c1e331af1c75ceb2ff
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 15

  redis:
    image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama@sha256:684d8674b4315fa18f4f0e973a118ec2652ed96f67563277839985175858e0ba
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks: [backend, egress]

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      mc version enable local/$$MINIO_BUCKET
      "
    networks: [backend]
    restart: "no"

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      ollama:
        condition: service_started
    networks: [backend, edge]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./secrets:/run/secrets:ro
    command: ["rq", "worker", "--url", "${REDIS_URL}", "document-ingest"]
    depends_on:
      api:
        condition: service_healthy
    networks: [backend, egress]

  connector-scheduler:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "app.connector_scheduler"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend]

  web:
    build: ./web
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]

  gateway:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - api
    ports:
      - "127.0.0.1:8080:8080"
    networks: [edge]


  db-backup:
    build: ./ops/db-backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_ENCRYPTION_PASSWORD: ${BACKUP_ENCRYPTION_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS}
    volumes:
      - ./backups/postgres:/backups
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

  object-backup:
    build: ./ops/object-backup
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      BACKUP_ENCRYPTION_PASSWORD: ${BACKUP_ENCRYPTION_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS}
    volumes:
      - ./backups/objects:/backups
    depends_on:
      minio-init:
        condition: service_completed_successfully
    networks: [backend]


  dr-monitor:
    build: ./ops/dr-monitor
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_ENCRYPTION_PASSWORD: ${BACKUP_ENCRYPTION_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS}
      DR_MONITOR_INTERVAL_SECONDS: ${DR_MONITOR_INTERVAL_SECONDS:-300}
      DR_MAX_BACKUP_AGE_HOURS: ${DR_MAX_BACKUP_AGE_HOURS:-36}
      DR_RESTORE_TEST_INTERVAL_HOURS: ${DR_RESTORE_TEST_INTERVAL_HOURS:-24}
      DR_RESTORE_TEST_ENABLED: ${DR_RESTORE_TEST_ENABLED:-true}
      DR_OFFSITE_REMOTE: ${DR_OFFSITE_REMOTE:-}
      DR_OFFSITE_CONFIG_PATH: ${DR_OFFSITE_CONFIG_PATH:-/run/secrets/rclone.conf}
      DR_OFFSITE_INTERVAL_HOURS: ${DR_OFFSITE_INTERVAL_HOURS:-6}
      DR_MIN_BACKUP_FREE_GB: ${DR_MIN_BACKUP_FREE_GB:-10}
    volumes:
      - ./backups:/backups
      - ./secrets:/run/secrets:ro
    depends_on:
      db:
        condition: service_healthy
      db-backup:
        condition: service_started
      object-backup:
        condition: service_started
    networks: [backend, egress]

networks:
  backend:
    internal: true
  edge:
  egress:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  minio_data:
