<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>MemoryBank Capture</title>
  <style>
    body { width: 330px; margin: 0; padding: 16px; font: 13px system-ui; background: #0d0f12; color: #eef2f6; }
    h1 { font-size: 16px; margin: 0 0 4px; }
    p { color: #8e98a5; line-height: 1.45; }
    input, textarea, button { box-sizing: border-box; width: 100%; border-radius: 9px; border: 1px solid #303640; background: #15181d; color: #eef2f6; padding: 9px; margin-top: 8px; }
    textarea { min-height: 90px; resize: vertical; }
    button { cursor: pointer; font-weight: 650; }
    button.primary { background: #b6ff4a; color: #10140b; border-color: #b6ff4a; }
    .row { display: flex; gap: 8px; }
    .status { min-height: 18px; margin-top: 9px; color: #b6ff4a; font-size: 11px; }
    .muted { color: #707985; font-size: 11px; }
  </style>
</head>
<body>
  <h1>MemoryBank Capture</h1>
  <p>Send useful pages and snippets straight into your self-hosted memory pipeline.</p>

  <input id="url" placeholder="https://memory.example.com">
  <input id="key" type="password" placeholder="mem_live_…">
  <button id="save">Save connection</button>

  <div class="row">
    <button id="page" class="primary">Capture page</button>
    <button id="selection">Selection</button>
  </div>

  <textarea id="note" placeholder="Quick note…"></textarea>
  <button id="noteButton">Save note</button>

  <div id="status" class="status"></div>
  <div class="muted">Use a capture:write-only key. Revoke it in MemoryBank if this browser profile is lost.</div>

  <script src="popup.js"></script>
</body>
</html>
