name: Manage stale issues and pull requests

on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 60
          days-before-close: 14
          stale-issue-message: "This issue has been inactive for 60 days. It will close in 14 days unless there is new activity."
          stale-pr-message: "This pull request has been inactive for 60 days. It will close in 14 days unless there is new activity."
          close-issue-message: "Closing this inactive issue. Reopen it if the problem is still relevant."
          close-pr-message: "Closing this inactive pull request. Reopen it if the work is still relevant."
          exempt-issue-labels: "pinned,security,roadmap"
          exempt-pr-labels: "pinned,security,roadmap"
