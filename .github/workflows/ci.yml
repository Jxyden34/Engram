name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  edition-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Package Personal and Commercial customer builds
        run: python scripts/package-editions.py
      - name: Validate extracted edition builds
        run: |
          for edition in personal commercial; do
            mkdir -p "/tmp/engram-$edition"
            unzip -q "dist/editions/engram-$(cat VERSION)-$edition.zip" -d "/tmp/engram-$edition"
            cp "/tmp/engram-$edition/.env.example" "/tmp/engram-$edition/.env"
            (cd "/tmp/engram-$edition" && docker compose config --quiet)
          done
      - uses: actions/upload-artifact@v7
        with:
          name: engram-customer-editions
          path: dist/editions/*

  dr-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install DR test tools
        run: sudo apt-get update && sudo apt-get install -y postgresql rclone jq shellcheck
      - name: Check DR scripts
        run: |
          shellcheck ops/dr-monitor/monitor.sh ops/db-backup/backup.sh ops/object-backup/backup.sh install.sh
          sh scripts/check-repo-secrets.sh
      - name: Test DR monitor with isolated PostgreSQL and local replication
        run: python3 scripts/test-dr-monitor.py

  backend:
    runs-on: ubuntu-latest

    env:
      PUBLIC_HOST: localhost
      PUBLIC_ORIGIN: http://localhost
      COOKIE_SECURE: "false"

      DATABASE_URL: postgresql://engram:engram-ci-postgres@127.0.0.1:5432/engram
      REDIS_URL: redis://127.0.0.1:6379/0

      MINIO_ACCESS_KEY: engram-ci
      MINIO_SECRET_KEY: engram-ci-secret

    services:
      postgres:
        image: "pgvector/pgvector:0.8.6-pg18-trixie@sha256:78bf48b801e792f99e3ac62b5036fd3876e9be48afda16c1e331af1c75ceb2ff"
        env:
          POSTGRES_DB: engram
          POSTGRES_USER: engram
          POSTGRES_PASSWORD: engram-ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U engram -d engram"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: "redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0"
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Initialize PostgreSQL schema
        run: |
          docker exec -i \
            "${{ job.services.postgres.id }}" \
            psql \
            -v ON_ERROR_STOP=1 \
            -U engram \
            -d engram \
            < db/init.sql

          docker exec -i \
            "${{ job.services.postgres.id }}" \
            psql -v ON_ERROR_STOP=1 -U engram -d engram \
            < db/migrations/009_projects_agent.sql

          docker exec -i \
            "${{ job.services.postgres.id }}" \
            psql -v ON_ERROR_STOP=1 -U engram -d engram \
            < db/migrations/010_project_oauth.sql

          docker exec -i \
            "${{ job.services.postgres.id }}" \
            psql -v ON_ERROR_STOP=1 -U engram -d engram \
            < db/migrations/011_agent_schedules.sql

          docker exec -i \
            "${{ job.services.postgres.id }}" \
            psql -v ON_ERROR_STOP=1 -U engram -d engram \
            < db/migrations/012_agent_review.sql

          docker exec -i \
            "${{ job.services.postgres.id }}" \
            psql -v ON_ERROR_STOP=1 -U engram -d engram \
            < db/migrations/013_project_briefs.sql

          docker exec -i \
            "${{ job.services.postgres.id }}" \
            psql -v ON_ERROR_STOP=1 -U engram -d engram \
            < db/migrations/014_commercial_license.sql

          for migration in db/migrations/0{15..20}_*.sql; do
            test -f "$migration" || continue
            docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U engram -d engram < "$migration"
          done

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python
        run: python -m compileall -q backend/app backend/scripts backend/tests

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check TypeScript
        run: pnpm check
      - name: Check offline draft storage
        run: pnpm test:drafts
      - name: Check offline memory library
        run: pnpm test:offline
      - name: Check memory history and connection helpers
        run: pnpm test:memory-tools
      - name: Check reviewed voice capture
        run: pnpm test:voice
      - name: Check dependency security regressions
        run: pnpm test:dependency-security
      - name: Check Expo package versions
        run: pnpm exec expo install --check
      - name: Check iOS native project generation
        run: pnpm exec expo prebuild --platform ios --no-install
      - name: Bundle iOS and Android
        run: pnpm export

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Prepare example environment
        run: cp .env.example .env

      - name: Validate compose
        run: docker compose config >/dev/null

      - name: Verify external runtime images are pullable
        run: |
          docker compose pull db redis ollama gateway minio
          docker pull docker.io/pgsty/mc@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd

      - name: Build object storage helper images
        run: docker compose build object-backup minio-init

      - name: Smoke test S3 bucket initialization
        run: |
          docker compose up -d minio minio-init
          init_container="$(docker compose ps --all --quiet minio-init)"
          test -n "$init_container"
          test "$(docker wait "$init_container")" = "0"

      - name: Build application images
        run: >
          docker compose build
          api worker connector-scheduler web
          db-backup dr-monitor

      - name: Verify Community and Commercial artifacts
        run: |
          docker build -t engram-community --build-arg ENGRAM_EDITION=community backend
          docker run --rm engram-community python -c "from pathlib import Path; from app.edition import get_edition; assert get_edition() == 'community'; assert not Path('/srv/app/commercial').exists(); assert not Path('/srv/scripts/commercial_license.py').exists()"
          docker build -t engram-commercial --build-arg ENGRAM_EDITION=commercial backend
          docker run --rm engram-commercial python -c "from pathlib import Path; from app.edition import get_edition; assert get_edition() == 'commercial'; assert Path('/srv/app/commercial/licensing.py').is_file(); assert not Path('/srv/scripts/commercial_license.py').exists()"
          docker build -t engram-licence-owner -f backend/owner/Dockerfile backend

      - name: Exercise full host installer on an isolated stack
        env:
          ENGRAM_INSTALL_ADMIN_USER: installer-admin
          ENGRAM_INSTALL_ADMIN_PASSWORD: installer-smoke-password-not-production
        run: |
          sudo --preserve-env=ENGRAM_INSTALL_ADMIN_USER,ENGRAM_INSTALL_ADMIN_PASSWORD python3 install.py \
            --directory /tmp/engram-installer-smoke --edition personal --host localhost \
            --mode proxy --port 18080 --non-interactive --skip-models
          curl --fail --silent http://127.0.0.1:18080/health
          curl --fail --silent http://127.0.0.1:18080/install.sh -o /tmp/engram-downloaded-install.sh
          cmp install.sh /tmp/engram-downloaded-install.sh
          bash -n /tmp/engram-downloaded-install.sh
      - name: Remove isolated installer test stack
        if: always()
        run: |
          if test -f /tmp/engram-installer-smoke/docker-compose.install.yml; then
            sudo docker compose --project-directory /tmp/engram-installer-smoke \
              -f /tmp/engram-installer-smoke/docker-compose.yml \
              -f /tmp/engram-installer-smoke/docker-compose.community.yml \
              -f /tmp/engram-installer-smoke/docker-compose.install.yml down --volumes
          fi
