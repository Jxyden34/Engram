name: Bug report
description: Report a reproducible problem with Engram
title: "[Bug] "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem!
        Never include API keys, credentials, private memories or personal data.
        Report security vulnerabilities privately following SECURITY.md.

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and how it affects you.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open…
        2. Click…
        3. Observe…
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should have happened?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Engram version
      description: Release tag or commit SHA. Include alpha/beta if applicable.
      placeholder: "e.g. v2.5.5"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        Host OS and architecture:
        Installation method:
        Browser and version:
        Access method (LAN, reverse proxy or tunnel):
        Relevant configuration changes:
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots or additional context
      description: |
        Optional. Include relevant errors or screenshots.
        Remove credentials, tokens, private content and personal information.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets and personal data from this report.
          required: true
