name: Bug report
description: Report a reproducible MemoryBank problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Do not paste secrets, tokens, private memory content or personal exports.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: input
    attributes:
      label: Version
      placeholder: v2.0.1

  - type: textarea
    attributes:
      label: Relevant sanitized logs
      description: Remove hostnames, tokens, credentials and personal data first.
